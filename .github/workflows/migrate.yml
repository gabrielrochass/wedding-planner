name: Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.0
      - run: |
          : "${SUPABASE_ACCESS_TOKEN:?Set the SUPABASE_ACCESS_TOKEN secret}"
          : "${SUPABASE_PROJECT_REF:?Set the SUPABASE_PROJECT_REF variable}"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --linked --dry-run
      - run: supabase db push --linked --yes
      - run: supabase migration list --linked
